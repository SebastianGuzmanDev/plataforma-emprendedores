{% load formularios %}
<div class="campo{% if campo.errors %} campo--error{% endif %}">
  <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
  {% if campo.help_text %}<div class="campo__ayuda" id="{{ campo.auto_id }}_helptext">{{ campo.help_text|safe }}</div>{% endif %}
  {{ campo|campo_accesible }}
  {% if campo.errors %}
    <div id="{{ campo.auto_id }}_error">
      {% for error in campo.errors %}<p class="campo__error"><span class="icono-alerta" aria-hidden="true">!</span><span>{{ error }}</span></p>{% endfor %}
    </div>
  {% endif %}
</div>
