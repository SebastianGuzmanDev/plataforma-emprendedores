<form class="buscador" method="get" role="search">
  <label for="id_q">{{ etiqueta }}</label>
  <div class="buscador__fila">
    <input type="search" id="id_q" name="q" value="{{ consulta }}" maxlength="100" placeholder="{{ ejemplo }}" autocomplete="off">
    <button type="submit" class="boton boton--primario">Buscar</button>
  </div>
</form>
